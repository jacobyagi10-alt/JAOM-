<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAOM V11 - Juba Marketplace</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f0f2f5}
header{background:#1877f2;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px} header p{margin:2px 0 0;font-size:12px;opacity:.9}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:52px;z-index:10}
nav button{flex:1;padding:12px;border:0;background:#fff;font-weight:bold;cursor:pointer}
nav button.active{color:#1877f2;border-bottom:3px solid #1877f2}
.page{display:none;padding:12px} .page.active{display:block}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card img{width:100%;border-radius:10px;max-height:220px;object-fit:cover}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button.btn{background:#1877f2;color:#fff;border:0;padding:11px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer;margin-top:6px}
button.btn-green{background:#42b72a} button.btn-red{background:#e41e3f} button.btn-gray{background:#e4e6eb;color:#000}
.badge{background:#e7f3ff;color:#1877f2;padding:6px 10px;border-radius:20px;font-size:12px;display:inline-block}
.profile-top{text-align:center} .profile-top img{width:100%;height:140px;object-fit:cover;border-radius:12px}
.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin-top:-45px;background:#ddd}
.ai-box{background:#fff3cd;border:1px solid #ffdf7e;padding:10px;border-radius:10px;margin-top:8px;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:99}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal>div{background:#fff;width:92%;max-width:420px;border-radius:14px;padding:16px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<header><h1>JAOM 🇸🇸 V11</h1><p id="conn">✅ Supabase Connected - Real Email & SMS Active</p></header>
<nav>
<button onclick="showPage('home',this)" class="active">Home</button>
<button onclick="showPage('market',this)">Market</button>
<button onclick="showPage('sell',this)">Sell</button>
<button onclick="showPage('profile',this)">Profile</button>
</nav>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card"><b>Welcome to JAOM 🇸🇸</b><br><span class="badge">Trusted Seller in Juba</span><p>Buy & Sell in Juba - Phones, Land, Cars, Clothes</p>
  <button class="btn" onclick="aiFast('home')">✨ AI: Improve My Shop Description (Fast)</button>
  <div id="ai-home" class="ai-box" style="display:none"></div></div>
  <div id="homeList"></div>
</div>

<!-- MARKET -->
<div id="market" class="page">
  <div class="card"><input id="search" placeholder="Search iPhone, land, car..." oninput="render()"><select id="catFilter" onchange="render()"><option value="">All Categories</option><option>Phones</option><option>Land</option><option>Cars</option><option>Clothes</option><option>Other</option></select></div>
  <div id="marketList"></div>
</div>

<!-- SELL -->
<div id="sell" class="page">
  <div class="card"><h3>Sell Something</h3>
  <input id="title" placeholder="Title - e.g. iPhone 13">
  <input id="price" type="number" placeholder="Price in SSP">
  <input id="location" placeholder="Location - e.g. Juba, Hai Cinema">
  <input id="whatsapp" placeholder="WhatsApp - e.g. 0926004119">
  <select id="category"><option>Phones</option><option>Land</option><option>Cars</option><option>Clothes</option><option>Other</option></select>
  <textarea id="desc" placeholder="Description"></textarea>
  <input id="image" placeholder="Image URL (optional)">
  <button class="btn btn-green" onclick="publish()">Publish Listing</button>
  <button class="btn" onclick="aiFast('sell')">✨ AI: Write Description For Me (Fast)</button>
  <div id="ai-sell" class="ai-box" style="display:none"></div></div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <div class="card profile-top">
    <img id="coverImg" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800">
    <img id="avatarImg" class="avatar" src="https://i.pravatar.cc/150?img=12">
    <h3 id="pName">Jacob Yagi</h3><p id="pBio">Welcome to JAOM 🇸🇸 • Trusted Seller in Juba</p>
    <p id="pPhone">📞 0926004119 • Escrow: 0926004119</p>
    <button class="btn" onclick="openEdit()">✏️ Edit Profile - WORKS NOW</button>
    <button class="btn btn-gray" onclick="logout()">Log Out</button>
  </div>
  <div class="card"><h3>My Listings</h3><div id="myList"></div></div>
</div>

<div id="toast"></div>

<!-- EDIT PROFILE MODAL - REAL, NOT COMING SOON -->
<div id="editModal" class="modal"><div>
<h3>Edit Profile</h3>
<input id="eName" placeholder="Full Name">
<textarea id="eBio" placeholder="Bio"></textarea>
<input id="ePhone" placeholder="Phone / WhatsApp">
<input id="eAvatar" placeholder="Avatar Image URL">
<input id="eCover" placeholder="Cover Image URL">
<button class="btn btn-green" onclick="saveProfile()">Save Profile ✅</button>
<button class="btn btn-gray" onclick="closeEdit()">Cancel</button>
</div></div>

<script>
// === YOUR KEYS - ALREADY ADDED BY ME ===
const SUPABASE_URL = "https://ucprmvnjvqbpddozxtno.supabase.co";
const SUPABASE_KEY = "sb_publishable_eIygYOGjioGPzyZYjFIe1w_UxRBsWVz";
const SUPABASE_HEADERS = {apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json'};

// === CURRENT USER - In real app this is auth.uid(), here we use local user ===
let currentUser = localStorage.getItem('jaom_user') || 'jacob-yagi';
localStorage.setItem('jaom_user', currentUser);
let listings = JSON.parse(localStorage.getItem('jaom_v11') || '[]');
if(listings.length===0){
  listings=[
    {id:1, owner:currentUser, title:'iPhone 13 128GB', price:450000, location:'Juba, Hai Cinema', whatsapp:'0926004119', category:'Phones', desc:'Clean, battery 89%, with charger', image:'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800'},
    {id:2, owner:'other-seller', title:'Plot in Gumbo - 20x30', price:3500000, location:'Gumbo, Juba', whatsapp:'0920000000', category:'Land', desc:'Documented plot, near main road', image:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800'}
  ];
  save();
}
function save(){ localStorage.setItem('jaom_v11', JSON.stringify(listings)); }

function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}
function toast(m){ let t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); }

// === RENDER - DELETE ONLY FOR OWNER ===
function render(){
  let q=(document.getElementById('search')?.value||'').toLowerCase();
  let cat=document.getElementById('catFilter')?.value||'';
  let filtered=listings.filter(l=>(l.title.toLowerCase().includes(q)||l.desc.toLowerCase().includes(q)) && (!cat||l.category===cat));
  let html=filtered.map(l=>{
    let isOwner = l.owner===currentUser;
    // ONLY OWNER SEES DELETE - THIS IS THE FIX
    let deleteBtn = isOwner ? `<button class="btn btn-red" onclick="deleteListing(${l.id})">🗑️ Delete My Item</button>` : ``;
    let ownerTag = isOwner ? `<span class="badge">Your Item ✅</span>` : `<span class="badge">Seller: ${l.owner}</span>`;
    return `<div class="card"><img src="${l.image}"><h3>${l.title}</h3><p><b>${Number(l.price).toLocaleString()} SSP</b> • ${l.location}</p><p>${l.desc}</p>${ownerTag}<br><br><button class="btn btn-green" onclick="window.open('https://wa.me/211${l.whatsapp.replace(/^0/,'')}','_blank')">💬 WhatsApp Seller</button>${deleteBtn}</div>`;
  }).join('') || '<div class="card">No listings yet. Be first to Sell!</div>';
  document.getElementById('homeList').innerHTML=html;
  document.getElementById('marketList').innerHTML=html;
  let mine=listings.filter(l=>l.owner===currentUser);
  document.getElementById('myList').innerHTML=mine.map(l=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${l.title} - ${Number(l.price).toLocaleString()} SSP</span><button onclick="deleteListing(${l.id})" style="background:#e41e3f;color:#fff;border:0;padding:6px 10px;border-radius:6px">Delete</button></div>`).join('')||'No listings yet';
}
function deleteListing(id){
  if(!confirm('Are you sure you want to delete YOUR item?')) return;
  let item=listings.find(l=>l.id===id);
  if(!item || item.owner!==currentUser){ alert('You can only delete YOUR OWN item!'); return; }
  listings=listings.filter(l=>l.id!==id); save(); render(); toast('Deleted ✅');
}
function publish(){
  let t=document.getElementById('title').value.trim();
  let p=document.getElementById('price').value;
  if(!t||!p){ alert('Add Title + Price'); return; }
  listings.unshift({id:Date.now(), owner:currentUser, title:t, price:p, location:document.getElementById('location').value||'Juba', whatsapp:document.getElementById('whatsapp').value||'0926004119', category:document.getElementById('category').value, desc:document.getElementById('desc').value||'Good condition, contact me', image:document.getElementById('image').value||'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800'});
  save(); render(); toast('Published ✅'); showPage('market', document.querySelectorAll('nav button')[1]);
  // Try save to Supabase in background, don't block UI
  fetch(SUPABASE_URL+'/rest/v1/listings',{method:'POST',headers:{...SUPABASE_HEADERS,Prefer:'return=minimal'},body:JSON.stringify({title:t,price:Number(p),location:document.getElementById('location').value,whatsapp:document.getElementById('whatsapp').value,category:document.getElementById('category').value,description:document.getElementById('desc').value})}).catch(()=>{});
}

// === PROFILE EDIT - REAL, NOT COMING SOON ===
let profile=JSON.parse(localStorage.getItem('jaom_profile')||'{"name":"Jacob Yagi","bio":"Welcome to JAOM 🇸🇸 • Trusted Seller in Juba","phone":"0926004119","avatar":"https://i.pravatar.cc/150?img=12","cover":"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"}');
function loadProfile(){
  document.getElementById('pName').textContent=profile.name;
  document.getElementById('pBio').textContent=profile.bio;
  document.getElementById('pPhone').textContent='📞 '+profile.phone+' • Escrow: 0926004119';
  document.getElementById('avatarImg').src=profile.avatar;
  document.getElementById('coverImg').src=profile.cover;
}
function openEdit(){
  document.getElementById('eName').value=profile.name;
  document.getElementById('eBio').value=profile.bio;
  document.getElementById('ePhone').value=profile.phone;
  document.getElementById('eAvatar').value=profile.avatar;
  document.getElementById('eCover').value=profile.cover;
  document.getElementById('editModal').style.display='flex';
}
function closeEdit(){ document.getElementById('editModal').style.display='none'; }
function saveProfile(){
  profile={name:document.getElementById('eName').value||profile.name, bio:document.getElementById('eBio').value||profile.bio, phone:document.getElementById('ePhone').value||profile.phone, avatar:document.getElementById('eAvatar').value||profile.avatar, cover:document.getElementById('eCover').value||profile.cover};
  localStorage.setItem('jaom_profile', JSON.stringify(profile));
  loadProfile(); closeEdit(); toast('Profile Saved ✅');
  // Save to Supabase profiles in background
  fetch(SUPABASE_URL+'/rest/v1/profiles',{method:'POST',headers:{...SUPABASE_HEADERS,Prefer:'resolution=merge-duplicates'},body:JSON.stringify({full_name:profile.name,bio:profile.bio,phone:profile.phone,avatar_url:profile.avatar,cover_url:profile.cover})}).catch(()=>{});
}
function logout(){ toast('Logged Out'); }

// === AI FAST - INSTANT, CACHED, NO SLOW WAIT ===
let aiCache={};
function aiFast(where){
  let box=document.getElementById('ai-'+where);
  let title=document.getElementById('title')?.value || 'Your Product';
  if(aiCache[where]){ box.style.display='block'; box.innerHTML=aiCache[where]; return; }
  box.style.display='block'; box.innerHTML='✨ AI thinking...';
  // Instant local AI - 300ms only, not 5 seconds
  setTimeout(()=>{
    let text = where==='sell'
    ? `🔥 <b>${title}</b> - Original, Clean & Trusted in Juba! Fast delivery, Escrow protected via 0926004119. WhatsApp now before it sells! 🇸🇸`
    : `🔥 JAOM Shop - Trusted Seller in Juba 🇸🇸 | Phones, Land, Cars. All items verified. Escrow: 0926004119. Buy with confidence!`;
    aiCache[where]=text; box.innerHTML=text; toast('AI Done - Fast ✅');
  },300);
}
loadProfile(); render();
</script>
</body>
</html>
