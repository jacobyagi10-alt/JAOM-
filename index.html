<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAOM - Juba Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f6f6f6;margin:0;padding:15px}
h1{color:#111;text-align:center} .card{background:#fff;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px #0001}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button{background:#111;color:#fff;padding:11px;border:none;border-radius:8px;width:100%;font-weight:bold}
img{width:100%;border-radius:10px}
</style>
</head>
<body>
<h1>JAOM 🇸🇸</h1>
<p style="text-align:center">Buy & Sell in Juba</p>

<div class="card">
<h3>Login / Sign Up</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button><br><br>
<button onclick="login()">Login</button>
<p id="authMsg"></p>
</div>

<div class="card">
<h3>Sell Something</h3>
<input id="title" placeholder="What are you selling? e.g. iPhone 13">
<input id="price" type="number" placeholder="Price in SSP">
<input id="image" placeholder="Image link (optional)">
<textarea id="desc" placeholder="Description"></textarea>
<select id="category"><option>Electronics</option><option>Fashion</option><option>Food</option><option>Home</option><option>Other</option></select>
<button onclick="addProduct()">Post Product</button>
</div>

<div class="card"><h3>Marketplace</h3><div id="list">Loading...</div></div>

<script>
const SUPABASE_URL = "https://ucprmvnjvqbpddozxtno.supabase.co";
const SUPABASE_KEY = "sb_publishable_eIygYOGjioGPzyZYjFIe1w_UxRBsWVz";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function signup(){
  const {error} = await supabaseClient.auth.signUp({email:email.value, password:password.value});
  document.getElementById('authMsg').innerText = error ? error.message : "Check email to confirm! Then Login";
}
async function login(){
  const {error} = await supabaseClient.auth.signInWithPassword({email:email.value, password:password.value});
  document.getElementById('authMsg').innerText = error ? error.message : "Logged in! ✅";
  load();
}
async function addProduct(){
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(!user) return alert("Login first!");
  const {error} = await supabaseClient.from('products').insert({
    seller_id: user.id,
    title: title.value,
    description: desc.value,
    price: price.value,
    category: category.value,
    image_url: image.value || null,
    is_available: true
  });
  alert(error ? error.message : "Posted! ✅");
  load();
}
async function load(){
  const {data} = await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
  document.getElementById('list').innerHTML = (data||[]).map(p=>`
    <div class="card"><b>${p.title}</b><br>${p.price} SSP<br>${p.description||''}<br>
    <button onclick="buy('${p.id}','${p.seller_id}',${p.price})">Buy Now</button></div>`).join('') || "No products yet - be first!";
}
async function buy(id, seller, price){
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(!user) return alert("Login first!");
  const {error} = await supabaseClient.from('orders').insert({buyer_id:user.id, seller_id:seller, product_id:id, total_amount:price, status:'pending'});
  alert(error ? error.message : "Order placed! Seller will contact you ✅");
}
load();
</script>
</body>
</html>
